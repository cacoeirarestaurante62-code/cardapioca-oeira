<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio - Manzuá Hotel & Caçoeira Restaurante</title>
    <style>
        /* CONFIGURAÇÃO DE CORES E FONTES */
        :root {
            --bg-body: #333333; /* Fundo cinza escuro fora do papel */
            
            /* ALTERAÇÃO: Fundo agora é VERDE ESCURO */
            --bg-paper: #083b24; 
            
            /* ALTERAÇÃO: Texto padrão agora é BRANCO */
            --text-color: #ffffff;
            
            --primary-color: #004225; 
            --accent-color: #ff4d4d; /* Vermelho mais claro para ler no fundo verde */
            
            /* ALTERAÇÃO: Pontilhados claros */
            --dotted-line: #aaaaaa;
            
            /* NOVAS CORES PARA CATEGORIA */
            --cat-bg: #fff5ba; /* Amarelo Claro */
            --cat-text: #000000; /* Texto Preto */
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* O PAPEL DO CARDÁPIO */
        .menu-paper {
            background-color: var(--bg-paper);
            color: var(--text-color);
            width: 100%;
            max-width: 1000px;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
        }

        /* --- CABEÇALHO (LOGOS) --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* Borda agora é branca ou dourada para destacar no verde? 
               Vou deixar sutil ou remover a borda para não brigar com o verde */
            border-bottom: 2px solid #ffffff40;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .header-left {
            text-align: center;
            width: 30%;
        }

        /* Fundo branco atrás das logos para elas aparecerem no fundo verde */
        .logo-bg {
            background-color: rgba(255,255,255,0.9);
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
        }

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            width: 40%;
        }

        .restaurant-logos {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .img-spaten {
            max-width: 150px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .img-restaurante {
            max-height: 80px;
            width: auto;
        }

        img {
            font-size: 12px;
            color: #ccc;
            /* Borda removida para visual final */
            border: none; 
        }

        /* --- GRID DO MENU --- */
        .menu-grid {
            column-count: 2;
            column-gap: 50px;
            column-rule: 1px solid #ffffff40; /* Linha separadora clara */
        }

        @media (max-width: 768px) {
            .menu-grid { column-count: 1; }
            header { flex-direction: column; gap: 20px; }
            .header-left, .header-right { width: 100%; align-items: center; }
            .restaurant-logos { justify-content: center; }
        }

        /* --- CATEGORIAS --- */
        .category-block {
            break-inside: avoid;
            margin-bottom: 25px;
        }

        h2 {
            /* ALTERAÇÃO: Background Amarelo Claro e Texto Preto */
            background-color: var(--cat-bg);
            color: var(--cat-text);
            
            padding: 5px 15px; /* Adicionado padding para ficar bonito o bloco */
            font-size: 1.4rem;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: inline-block;
            border-radius: 4px; /* Cantos levemente arredondados */
            font-weight: 800;
            border-bottom: none; /* Removemos a linha pois agora tem fundo */
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        /* --- ITENS --- */
        .item {
            margin-bottom: 12px;
        }

        .item-row {
            display: flex;
            align-items: flex-end;
            width: 100%;
        }

        .item-id {
            font-weight: bold;
            color: #ffd700; /* Dourado para destacar os números no verde */
            margin-right: 8px;
            min-width: 25px;
        }

        .item-name {
            /* ALTERAÇÃO: Branco bem "negrito" */
            font-weight: 900; 
            color: #ffffff;
            white-space: nowrap;
            font-size: 1rem;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5); /* Sombra leve para leitura */
        }

        .dots {
            flex-grow: 1;
            border-bottom: 2px dotted var(--dotted-line);
            margin: 0 5px 6px 5px;
            min-width: 20px;
            opacity: 0.6;
        }

        .item-price {
            font-weight: bold;
            color: #ffffff;
            font-size: 1.05rem;
        }

        .item-desc {
            font-size: 0.85rem;
            /* Cor clara para descrição */
            color: #dddddd; 
            margin-top: 2px;
            padding-left: 35px;
            line-height: 1.3;
            font-style: italic;
        }

        /* --- RODAPÉ --- */
        .footer {
            margin-top: 40px;
            border-top: 1px solid #ffffff40;
            padding-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: #eeeeee; /* Texto do rodapé claro */
        }

        .warning-text {
            color: #ff9999; /* Vermelho claro/salmão para aviso no fundo escuro */
            font-weight: bold;
            margin-top: 15px;
            font-size: 0.8rem;
            text-transform: uppercase;
            border: 1px solid #ff9999;
            padding: 10px;
            display: inline-block;
        }
        
        .service-tax {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
            color: #fff5ba; /* Amarelo claro igual categoria */
        }
    </style>
</head>

    function renderMenu() {
        const container = document.getElementById('menu-container');

            sectionDiv.className = 'category-block';
            
            const title = document.createElement('h2');
            title.innerText = section.category;
            sectionDiv.appendChild(title);

            section.items.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item';
                
                const row = document.createElement('div');
                row.className = 'item-row';
                
                const idSpan = document.createElement('span');
                idSpan.className = 'item-id';
                idSpan.innerText = item.id;
                
                const nameSpan = document.createElement('span');
                nameSpan.className = 'item-name';
                nameSpan.innerText = item.name;

                dotsDiv.className = 'dots';
                
                const priceSpan = document.createElement('span');
                priceSpan.className = 'item-price';
                priceSpan.innerText = item.price;
                
                row.appendChild(idSpan);
                row.appendChild(nameSpan);
                row.appendChild(dotsDiv);
                row.appendChild(priceSpan);
                itemDiv.appendChild(row);
                
                if (item.desc) {
                    const descDiv = document.createElement('div');
                    descDiv.className = 'item-desc';
                    descDiv.innerText = item.desc;
                    itemDiv.appendChild(descDiv);
                }
                
                sectionDiv.appendChild(itemDiv);
            });

        });
